<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-labelledby="title desc">
  <title id="title">See You in the Next Commit — CoreCoderX</title>
  <desc id="desc">Don't just use the system. Understand the system. An illustrated stack of books titled Code, Build, Repeat, beside a steaming mug and a quietly turning desk windmill.</desc>
  <style>
    text { font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; fill: #182333; }
    .ink { stroke: #182333; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .steam { fill: none; stroke: #607da5; stroke-width: 2.5; stroke-linecap: round; animation: steam 4s ease-in-out infinite; }
    .second { animation-delay: -2s; }
    .rotor { transform-origin: 908px 82px; animation: turn 20s linear infinite; }
    @keyframes steam { 0%,100% { transform: translateY(2px); opacity: .4; } 50% { transform: translateY(-6px); opacity: 1; } }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1000" height="200" rx="32" fill="#f6f3eb"/>
  <rect x="12" y="12" width="976" height="176" rx="20" fill="none" stroke="#182333" stroke-width="2"/>
  <text x="40" y="47" font-size="11" font-weight="700" letter-spacing="2.3">A NOTE BEFORE YOU GO</text>
  <text x="40" y="89" font-size="25" letter-spacing="-.4">Don't just use the system.</text>
  <text x="40" y="123" font-size="27" font-weight="700" letter-spacing="-.5">Understand the system.</text>
  <text x="40" y="161" font-size="14" fill="#526579">See you in the next commit. <tspan font-weight="700">— CoreCoderX</tspan></text>
