<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="604" viewBox="0 0 1000 604" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Lifecycle — A Working Notebook</title>
  <desc id="desc">Requirement Analysis: Understand the real ask; Define system boundary; Identify constraints; Clarify assumptions. System Design: Architecture decisions; Data model design; API contracts first; Tech trade-offs. Implementation: Handle edge cases first; Test before shipping; Review every decision; Document the why. Iteration: Deploy with caution; Monitor real behavior; Benchmark bottlenecks; Refine and repeat.</desc>
  <defs>
    <pattern id="paper" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#182333" opacity=".075"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" fill="none" stroke="#607da5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <style>
    text { font-family: 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; fill: #182333; }
    .label { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
    .body { font-size: 18px; fill: #425369; }
    .ink { fill: none; stroke: #182333; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .route { fill: none; stroke: #607da5; stroke-width: 2; stroke-dasharray: 5 7; marker-end: url(#arrow); animation: travel 2.5s linear infinite; }
    .tab { animation: tab 12s ease-in-out infinite; }
    .two { animation-delay: -9s; } .three { animation-delay: -6s; } .four { animation-delay: -3s; }
    .pencil { animation: pencil 4s ease-in-out infinite; }
    .gear { transform-origin: 933px 348px; animation: turn 18s linear infinite; }
    @keyframes travel { to { stroke-dashoffset: -48; } }
    @keyframes tab { 0%,22%,100% { fill: #607da5; } 28%,94% { fill: #dce5ee; } }
    @keyframes pencil { 0%,100% { transform: translate(0,0); } 50% { transform: translate(3px,-3px); } }
    @keyframes turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1000" height="604" rx="32" fill="#f6f3eb"/>
  <rect width="1000" height="604" rx="32" fill="url(#paper)"/>
  <rect x="12" y="12" width="976" height="580" rx="20" fill="none" stroke="#182333" stroke-width="2"/>
  <text x="38" y="47" font-size="12" font-weight="700" letter-spacing="2">A WORKING NOTEBOOK</text>
  <text x="962" y="47" text-anchor="end" font-size="12" fill="#526579">From the first question to the next iteration.</text>

  <!-- Notebook 01 -->
  <rect x="36" y="78" width="448" height="209" rx="12" fill="#d5dce2"/>
  <rect x="32" y="74" width="448" height="209" rx="12" fill="#fffdf8" stroke="#182333" stroke-width="2"/>
  <rect class="tab" x="48" y="92" width="39" height="33" rx="8" fill="#dce5ee"/>
  <text x="67" y="114" text-anchor="middle" font-size="15" font-weight="700">01</text>
  <text class="label" x="99" y="115">Requirement Analysis</text>
  <path d="M49 138h412M78 148v115" stroke="#d8e1e9" stroke-width="1.5"/>
  <g class="body">
    <text x="92" y="164">Understand the real ask</text>
    <text x="92" y="195">Define system boundary</text>
    <text x="92" y="226">Identify constraints</text>
    <text x="92" y="257">Clarify assumptions</text>
  </g>
  <g fill="#607da5"><circle cx="61" cy="158" r="3"/><circle cx="61" cy="189" r="3"/><circle cx="61" cy="220" r="3"/><circle cx="61" cy="251" r="3"/></g>
  <g class="ink"><circle cx="440" cy="104" r="10"/><path d="m448 112 9 9"/></g>

  <!-- Notebook 02 -->
  <rect x="524" y="78" width="448" height="209" rx="12" fill="#d5dce2"/>
  <rect x="520" y="74" width="448" height="209" rx="12" fill="#fffdf8" stroke="#182333" stroke-width="2"/>
  <rect class="tab two" x="536" y="92" width="39" height="33" rx="8" fill="#dce5ee"/>
  <text x="555" y="114" text-anchor="middle" font-size="15" font-weight="700">02</text>
  <text class="label" x="587" y="115">System Design</text>
  <path d="M537 138h412M566 148v115" stroke="#d8e1e9" stroke-width="1.5"/>
  <g class="body">
    <text x="580" y="164">Architecture decisions</text>
    <text x="580" y="195">Data model design</text>
    <text x="580" y="226">API contracts first</text>
    <text x="580" y="257">Tech trade-offs</text>
  </g>
  <g fill="#607da5"><circle cx="549" cy="158" r="3"/><circle cx="549" cy="189" r="3"/><circle cx="549" cy="220" r="3"/><circle cx="549" cy="251" r="3"/></g>
  <g class="ink"><rect x="925" y="91" width="15" height="11" rx="2"/><path d="M932 102v9m-11 0h22m-22 0v6m22-6v6"/><rect x="915" y="117" width="12" height="9" rx="2"/><rect x="937" y="117" width="12" height="9" rx="2"/></g>

  <path class="route" d="M484 180h30"/>
  <path class="route" d="M744 287v15H256v16"/>

  <!-- Notebook 03 -->
  <rect x="36" y="328" width="448" height="209" rx="12" fill="#d5dce2"/>
  <rect x="32" y="324" width="448" height="209" rx="12" fill="#fffdf8" stroke="#182333" stroke-width="2"/>
  <rect class="tab three" x="48" y="342" width="39" height="33" rx="8" fill="#dce5ee"/>
  <text x="67" y="364" text-anchor="middle" font-size="15" font-weight="700">03</text>
  <text class="label" x="99" y="365">Implementation</text>
  <path d="M49 388h412M78 398v115" stroke="#d8e1e9" stroke-width="1.5"/>
  <g class="body">
    <text x="92" y="414">Handle edge cases first</text>
    <text x="92" y="445">Test before shipping</text>
    <text x="92" y="476">Review every decision</text>
    <text x="92" y="507">Document the why</text>
  </g>
  <g fill="#607da5"><circle cx="61" cy="408" r="3"/><circle cx="61" cy="439" r="3"/><circle cx="61" cy="470" r="3"/><circle cx="61" cy="501" r="3"/></g>
  <g class="ink pencil"><path d="m433 365 4-12 17-17 8 8-17 17-12 4Zm4-12 8 8m5-21 8 8"/><path d="M432 373h29" stroke="#91abc9"/></g>

  <!-- Notebook 04 -->
  <rect x="524" y="328" width="448" height="209" rx="12" fill="#d5dce2"/>
  <rect x="520" y="324" width="448" height="209" rx="12" fill="#fffdf8" stroke="#182333" stroke-width="2"/>
  <rect class="tab four" x="536" y="342" width="39" height="33" rx="8" fill="#dce5ee"/>
  <text x="555" y="364" text-anchor="middle" font-size="15" font-weight="700">04</text>
  <text class="label" x="587" y="365">Iteration</text>
  <path d="M537 388h412M566 398v115" stroke="#d8e1e9" stroke-width="1.5"/>
  <g class="body">
    <text x="580" y="414">Deploy with caution</text>
    <text x="580" y="445">Monitor real behavior</text>
    <text x="580" y="476">Benchmark bottlenecks</text>
    <text x="580" y="507">Refine and repeat</text>
  </g>
  <g fill="#607da5"><circle cx="549" cy="408" r="3"/><circle cx="549" cy="439" r="3"/><circle cx="549" cy="470" r="3"/><circle cx="549" cy="501" r="3"/></g>
  <g class="ink gear"><circle cx="933" cy="348" r="11"/><circle cx="933" cy="348" r="4"/><path d="M933 332v5m0 22v5m16-16h-5m-22 0h-5m5-11 4 4m14 14 4 4m0-22-4 4m-14 14-4 4"/></g>
  <path class="route" d="M484 430h30"/>
  <path d="M48 562h273m358 0h273" stroke="#b7c6d6" stroke-width="1.5"/>
  <text x="500" y="568" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.3">LEARN. REFINE. GO AGAIN.</text>
</svg>
