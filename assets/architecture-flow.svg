<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 148" width="100%">
  <title>Software Engineering Lifecycle - CoreCoderX</title>
  <desc>Four-phase software engineering workflow: Requirement Analysis, System Design, Implementation, and Iteration. The general process used by Sivaprakash CoreCoderX for building reliable software systems.</desc>

  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    @keyframes nodePulse { 0%,100%{stroke-opacity:.35} 50%{stroke-opacity:1} }
    @keyframes flowMove  { 0%{stroke-dashoffset:18} 100%{stroke-dashoffset:0} }

    .c1 { stroke:#E07355; animation: nodePulse 3s ease-in-out 0s    infinite; }
    .c2 { stroke:#4B7CF3; animation: nodePulse 3s ease-in-out .75s  infinite; }
    .c3 { stroke:#E07355; animation: nodePulse 3s ease-in-out 1.5s  infinite; }
    .c4 { stroke:#4B7CF3; animation: nodePulse 3s ease-in-out 2.25s infinite; }
    .flow { stroke-dasharray:5 5; animation: flowMove 1.4s linear infinite; }

    .or  { fill: #E07355; }
    .bl  { fill: #4B7CF3; }
    .dk  { fill: #1C1C1E; }
    .mt  { fill: #6B7280; }
    .bd  { stroke: #E5E7EB; }

    @media (prefers-color-scheme: dark) {
      .dk { fill: #E5E7EB; }
      .mt { fill: #9CA3AF; }
      .bd { stroke: #2D333B; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:.001ms !important; stroke-opacity:1 !important; }
    }
  </style>

  <rect x="2" y="2" width="846" height="144" rx="8" fill="none" class="bd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Card 1: Requirement Analysis -->
  <g transform="translate(14,10)">
    <rect width="192" height="122" rx="7" fill="none" stroke-width="1.2" class="c1"/>
    <circle cx="16" cy="20" r="4" fill="#FF5F57"/>
    <circle cx="30" cy="20" r="4" fill="#FFBD2E"/>
    <circle cx="44" cy="20" r="4" fill="#27C93F"/>
    <text x="96" y="24" class="mono mt" font-size="10" text-anchor="middle">req-analysis.ts</text>
    <line x1="0" y1="34" x2="192" y2="34" class="bd" stroke-width="1"/>
    <text x="14" y="55"  class="mono" font-size="11"><tspan class="or">&gt;</tspan><tspan class="dk"> Understand the real ask</tspan></text>
    <text x="14" y="73"  class="mono" font-size="11"><tspan class="or">&gt;</tspan><tspan class="dk"> Define system boundary</tspan></text>
    <text x="14" y="91"  class="mono" font-size="11"><tspan class="or">&gt;</tspan><tspan class="dk"> Identify constraints</tspan></text>
    <text x="14" y="109" class="mono" font-size="11"><tspan class="or">&gt;</tspan><tspan class="dk"> Clarify assumptions</tspan></text>
  </g>

  <!-- Arrow 1 -->
  <line x1="206" y1="71" x2="228" y2="71" stroke="#E07355" stroke-width="1.4" class="flow"/>
  <polygon points="225,67 233,71 225,75" fill="#E07355"/>

  <!-- Card 2: System Design -->
  <g transform="translate(233,10)">
    <rect width="192" height="122" rx="7" fill="none" stroke-width="1.2" class="c2"/>
    <circle cx="16" cy="20" r="4" fill="#FF5F57"/>
    <circle cx="30" cy="20" r="4" fill="#FFBD2E"/>
    <circle cx="44" cy="20" r="4" fill="#27C93F"/>
    <text x="96" y="24" class="mono mt" font-size="10" text-anchor="middle">sys-design.ts</text>
    <line x1="0" y1="34" x2="192" y2="34" class="bd" stroke-width="1"/>
    <text x="14" y="55"  class="mono" font-size="11"><tspan class="bl">$</tspan><tspan class="dk"> Architecture decisions</tspan></text>
    <text x="14" y="73"  class="mono" font-size="11"><tspan class="bl">$</tspan><tspan class="dk"> Data model design</tspan></text>
    <text x="14" y="91"  class="mono" font-size="11"><tspan class="bl">$</tspan><tspan class="dk"> API contracts first</tspan></text>
    <text x="14" y="109" class="mono" font-size="11"><tspan class="bl">$</tspan><tspan class="dk"> Tech trade-offs</tspan></text>
  </g>

  <!-- Arrow 2 -->
  <line x1="425" y1="71" x2="447" y2="71" stroke="#4B7CF3" stroke-width="1.4" class="flow"/>
  <polygon points="444,67 452,71 444,75" fill="#4B7CF3"/>

  <!-- Card 3: Implementation -->
  <g transform="translate(452,10)">
    <rect width="192" height="122" rx="7" fill="none" stroke-width="1.2" class="c3"/>
    <circle cx="16" cy="20" r="4" fill="#FF5F57"/>
    <circle cx="30" cy="20" r="4" fill="#FFBD2E"/>
    <circle cx="44" cy="20" r="4" fill="#27C93F"/>
    <text x="96" y="24" class="mono mt" font-size="10" text-anchor="middle">implementation.ts</text>
    <line x1="0" y1="34" x2="192" y2="34" class="bd" stroke-width="1"/>
    <text x="14" y="55"  class="mono" font-size="11"><tspan class="or">&gt;</tspan><tspan class="dk"> Handle edge cases first</tspan></text>
    <text x="14" y="73"  class="mono" font-size="11"><tspan class="or">&gt;</tspan><tspan class="dk"> Test before shipping</tspan></text>
    <text x="14" y="91"  class="mono" font-size="11"><tspan class="or">&gt;</tspan><tspan class="dk"> Review every decision</tspan></text>
    <text x="14" y="109" class="mono" font-size="11"><tspan class="or">&gt;</tspan><tspan class="dk"> Document the why</tspan></text>
  </g>

  <!-- Arrow 3 -->
  <line x1="644" y1="71" x2="666" y2="71" stroke="#E07355" stroke-width="1.4" class="flow"/>
  <polygon points="663,67 671,71 663,75" fill="#E07355"/>

  <!-- Card 4: Iterate -->
  <g transform="translate(671,10)">
    <rect width="173" height="122" rx="7" fill="none" stroke-width="1.2" class="c4"/>
    <circle cx="16" cy="20" r="4" fill="#FF5F57"/>
    <circle cx="30" cy="20" r="4" fill="#FFBD2E"/>
    <circle cx="44" cy="20" r="4" fill="#27C93F"/>
    <text x="86" y="24" class="mono mt" font-size="10" text-anchor="middle">iterate.ts</text>
    <line x1="0" y1="34" x2="173" y2="34" class="bd" stroke-width="1"/>
    <text x="14" y="55"  class="mono" font-size="11"><tspan class="bl">$</tspan><tspan class="dk"> Deploy with caution</tspan></text>
    <text x="14" y="73"  class="mono" font-size="11"><tspan class="bl">$</tspan><tspan class="dk"> Monitor real behavior</tspan></text>
    <text x="14" y="91"  class="mono" font-size="11"><tspan class="bl">$</tspan><tspan class="dk"> Benchmark bottlenecks</tspan></text>
    <text x="14" y="109" class="mono" font-size="11"><tspan class="bl">$</tspan><tspan class="dk"> Refine and repeat</tspan></text>
  </g>
</svg>
