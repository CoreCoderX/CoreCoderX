<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%">
  <title>Project Signal List - CoreCoderX</title>
  <desc>Terminal list of the four selected projects from the CoreCoderX profile: ZenXChat, BankBackendApp, Keymontr, and ZenXHub, each with its focus area. ZenXHub is marked as in active development.</desc>

  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

    @keyframes pulse    { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes blink    { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes flowMove { 0%{stroke-dashoffset:20} 100%{stroke-dashoffset:0} }

    .sig { animation: pulse 4s ease-in-out infinite; }
    .s2  { animation-delay: 1s; }
    .s3  { animation-delay: 2s; }
    .s4  { animation-delay: 3s; }
    .cursor { animation: blink 1.1s step-end infinite; fill: #E07355; }
    .track  { stroke-dasharray: 4 6; animation: flowMove 1.6s linear infinite; }

    .or  { fill: #E07355; }
    .bl  { fill: #4B7CF3; }
    .dk  { fill: #1C1C1E; }
    .mt  { fill: #6B7280; }
    .bd  { stroke: #E5E7EB; }

    @media (prefers-color-scheme: dark) {
      .dk { fill: #E5E7EB; }
      .mt { fill: #9CA3AF; }
      .bd { stroke: #2D333B; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sig, .cursor, .track { animation: none !important; }
    }
  </style>

  <rect x="2" y="2" width="846" height="196" rx="10" fill="none" class="bd" stroke-width="1"/>

  <!-- Terminal chrome -->
  <circle cx="22" cy="28" r="5" fill="#FF5F57"/>
  <circle cx="38" cy="28" r="5" fill="#FFBD2E"/>
  <circle cx="54" cy="28" r="5" fill="#27C93F"/>
  <text x="74" y="33" class="mono mt" font-size="12" font-weight="600">~/projects</text>
  <text x="172" y="33" class="mono mt" font-size="12">--signal</text>
  <text x="830" y="33" class="mono mt" font-size="11" text-anchor="end">selected: 4</text>

  <line x1="16" y1="50" x2="834" y2="50" class="bd" stroke-width="1"/>

  <!-- Signal track -->
  <line x1="42" y1="64" x2="42" y2="181" stroke="#E07355" stroke-width="1.4" opacity="0.5" class="track"/>

  <!-- Project rows -->
  <g>
    <circle cx="42" cy="80" r="4.5" fill="#E07355" class="sig"/>
    <text x="62" y="84" class="mono dk" font-size="13" font-weight="600">ZenXChat</text>
    <text x="300" y="84" class="mono mt" font-size="12">multi-LLM chat</text>
    <text x="830" y="84" class="mono mt" font-size="11" text-anchor="end">published</text>
  </g>

  <g>
    <circle cx="42" cy="112" r="4.5" fill="#4B7CF3" class="sig s2"/>
    <text x="62" y="116" class="mono dk" font-size="13" font-weight="600">BankBackendApp</text>
    <text x="300" y="116" class="mono mt" font-size="12">banking backend</text>
    <text x="830" y="116" class="mono mt" font-size="11" text-anchor="end">published</text>
  </g>

  <g>
    <circle cx="42" cy="144" r="4.5" fill="#E07355" class="sig s3"/>
    <text x="62" y="148" class="mono dk" font-size="13" font-weight="600">Keymontr</text>
    <text x="300" y="148" class="mono mt" font-size="12">secret detection</text>
    <text x="830" y="148" class="mono mt" font-size="11" text-anchor="end">published</text>
  </g>

  <g>
    <circle cx="42" cy="176" r="4.5" fill="#4B7CF3" class="sig s4"/>
    <text x="62" y="180" class="mono dk" font-size="13" font-weight="600">ZenXHub</text>
    <text x="300" y="180" class="mono mt" font-size="12">ai infrastructure</text>
    <text x="830" y="180" class="mono mt" font-size="11" text-anchor="end">in progress <tspan class="cursor">_</tspan></text>
  </g>
</svg>
